<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-time Object Detection</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        color: white;
        padding: 20px;
      }

      .container {
        text-align: center;
        max-width: 900px;
        width: 100%;
      }

      h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
        background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        color: #aaa;
        margin-bottom: 30px;
        font-size: 0.95em;
      }

      .controls {
        display: flex;
        gap: 15px;
        justify-content: center;
        align-items: center;
        margin-bottom: 25px;
        flex-wrap: wrap;
      }

      .control-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      label {
        font-weight: 600;
        font-size: 1.05em;
        color: #00ff88;
      }

      select {
        padding: 10px 20px;
        font-size: 1em;
        border-radius: 8px;
        background: #333;
        color: #00ff88;
        border: 2px solid #00ff88;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        min-width: 150px;
      }

      select:hover {
        background: #404040;
        box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
      }

      select:focus {
        outline: none;
        box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
      }

      .status {
        padding: 8px 15px;
        background: #00ff88;
        color: #1a1a1a;
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.9em;
      }

      .video-container {
        position: relative;
        display: inline-block;
        width: 100%;
        max-width: 800px;
        margin-top: 20px;
        background: #0a0a0a;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
      }

      img {
        width: 100%;
        height: auto;
        display: block;
        border: 3px solid #00ff88;
        border-radius: 10px;
      }

      .info {
        margin-top: 25px;
        padding: 15px;
        background: rgba(51, 51, 51, 0.5);
        border-radius: 8px;
        border-left: 4px solid #00ff88;
        text-align: left;
        font-size: 0.9em;
        color: #ccc;
      }

      .info strong {
        color: #00ff88;
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 1.8em;
        }

        .controls {
          flex-direction: column;
          gap: 12px;
        }

        select {
          min-width: 100%;
        }

        img {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎥 Real-time Object Detection</h1>
      <p class="subtitle">YOLOv8 powered detection on live webcam stream</p>

      <div class="controls">
        <div class="control-group">
          <label for="cameraSelect">Camera:</label>
          <select id="cameraSelect" onchange="setCamera()">
            <option value="">Loading cameras...</option>
          </select>
        </div>
        <div class="control-group">
          <label for="classSelect">Target Class:</label>
          <select id="classSelect" onchange="setClass()">
            <option value="person">👤 Person</option>
            <option value="vehicle">🚗 Vehicle</option>
            <option value="animal">🐾 Animal</option>
          </select>
        </div>
        <div class="status" id="status">Ready</div>
      </div>

      <div class="video-container">
        <img src="/video" alt="Live Video Stream" id="videoStream" />
      </div>

      <div class="info">
        <strong>Detection Filters:</strong><br />
        👤 <strong>Person:</strong> Humans detected in frame<br />
        🚗 <strong>Vehicle:</strong> Cars, trucks, bikes, buses, etc.<br />
        🐾 <strong>Animal:</strong> Dogs, cats, birds, and other animals
      </div>
    </div>

    <script>
      function loadCameras() {
        fetch("/api/cameras")
          .then((response) => response.json())
          .then((data) => {
            const cameraSelect = document.getElementById("cameraSelect");
            cameraSelect.innerHTML = "";

            if (data.cameras.length === 0) {
              cameraSelect.innerHTML = "<option>No cameras found</option>";
              return;
            }

            data.cameras.forEach((cam) => {
              const option = document.createElement("option");
              option.value = cam;
              option.textContent = `📹 Camera ${cam}`;
              if (cam === data.current) {
                option.selected = true;
              }
              cameraSelect.appendChild(option);
            });
          })
          .catch(() => {
            document.getElementById("cameraSelect").innerHTML =
              "<option>Error loading cameras</option>";
          });
      }

      function setCamera() {
        const selectedCamera = document.getElementById("cameraSelect").value;
        const statusEl = document.getElementById("status");

        if (!selectedCamera) return;

        statusEl.textContent = "Switching camera...";

        fetch(`/api/set-camera/${selectedCamera}`, { method: "POST" })
          .then((response) => {
            if (response.ok) {
              statusEl.textContent = `Camera ${selectedCamera} Active`;
              statusEl.style.background = "#00ff88";
              // Refresh video stream
              document.getElementById("videoStream").src =
                "/video?" + new Date().getTime();
            } else {
              statusEl.textContent = "Camera Error";
              statusEl.style.background = "#ff4444";
            }
          })
          .catch(() => {
            statusEl.textContent = "Connection Error";
            statusEl.style.background = "#ff4444";
          });
      }

      function setClass() {
        const selectedClass = document.getElementById("classSelect").value;
        const statusEl = document.getElementById("status");

        statusEl.textContent = "Updating...";

        fetch(`/api/set-class/${selectedClass}`, { method: "POST" })
          .then((response) => {
            if (response.ok) {
              statusEl.textContent = `Detecting: ${selectedClass}`;
              statusEl.style.background = "#00ff88";
            } else {
              statusEl.textContent = "Error";
              statusEl.style.background = "#ff4444";
            }
          })
          .catch(() => {
            statusEl.textContent = "Connection Error";
            statusEl.style.background = "#ff4444";
          });
      }

      // Initialize on load
      window.addEventListener("DOMContentLoaded", () => {
        loadCameras();
        setClass();
      });

      // Refresh video stream on reconnect
      document.getElementById("videoStream").addEventListener("error", () => {
        setTimeout(() => {
          document.getElementById("videoStream").src =
            "/video?" + new Date().getTime();
        }, 3000);
      });
    </script>
  </body>
</html>
